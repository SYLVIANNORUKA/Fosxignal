# Runs the signal scanner every 15 minutes and sends new signals to Telegram.
# It never places trades.
name: Forex signal scanner

on:
  schedule:
    # 2 minutes after each 15-minute candle closes (times are UTC), Sunday-Friday.
    # The forex market is closed on Saturday. GitHub may start runs a few minutes late.
    - cron: "2,17,32,47 * * * 0-5"
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

# Never run two scans at once (they would both edit sent_signals.json).
concurrency:
  group: signal-scanner
  cancel-in-progress: false

permissions:
  contents: write   # needed to save sent_signals.json back to the repository

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Scan and send signals
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      # Remember which signals were sent, so the next run doesn't send them again.
      - name: Save sent-signal record
        if: always()
        run: |
          git config user.name "signal-scanner-bot"
          git config user.email "signal-scanner-bot@users.noreply.github.com"
          git add sent_signals.json
          git diff --cached --quiet || (git commit -m "Update sent signals" && git push)
