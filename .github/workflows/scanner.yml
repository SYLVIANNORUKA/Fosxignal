# Runs the signal scanner every 5 minutes and sends new signals to Telegram.
# It never places trades.
name: Forex signal scanner

on:
  schedule:
    # Every 5 minutes, 1 minute after each 5M candle closes (:01, :06, :11 ... UTC),
    # Sunday-Friday. The forex market is closed on Saturday.
    # Each run checks only the most recently CLOSED candle of every timeframe, so a
    # 5M candle needs a run every 5 minutes (15M/1H/4H closes line up with these runs).
    # GitHub may start runs a few minutes late or skip one when it is busy.
    - cron: "1-59/5 * * * 0-5"
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

# Never run two scans at once (they would both edit sent_signals.json and could
# send the same signal twice). A new run waits until the previous one has finished;
# cancel-in-progress: false means a running scan is never stopped halfway.
concurrency:
  group: signal-scanner
  cancel-in-progress: false

permissions:
  contents: write   # needed to save sent_signals.json back to the repository

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4   # a stuck run is stopped before the next 5-minute run is due
    steps:
      # Check out the branch's LATEST commit, not the one from when this run was queued,
      # so we always have the newest sent_signals.json (the previous run may have just
      # updated it while this run was waiting).
      - name: Get the code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Scan and send signals
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional email alerts (Gmail). If these secrets don't exist, email is skipped.
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scanner.py

      # Remember which signals were sent, so the next run doesn't send them again.
      - name: Save sent-signal record
        if: always()
        run: |
          git config user.name "signal-scanner-bot"
          git config user.email "signal-scanner-bot@users.noreply.github.com"
          git add sent_signals.json
          git diff --cached --quiet || (git commit -m "Update sent signals" && git pull --rebase && git push)
